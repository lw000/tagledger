# 工业点位采集服务 白名单配置
# 一行一条规则；'#' 开头为注释。
# 规则格式：
#   192.168.1.10                 —— 来源 IP（IPv4/IPv6 精确匹配）
#   10.0.0.0/8                   —— 来源 IP（IPv4 CIDR 网段）
#   origin:http://localhost:*    —— 浏览器 Origin 前缀通配（* 仅可位于末尾端口）
# 判定：IP 命中任一 IP 规则，或 Origin 命中任一 origin 规则 → 放行；否则 403 拦截。
# 注意：删除整个文件将进入"放行所有来源"的开放模式（启动日志会 WARN 提示）。

127.0.0.1
::1
192.168.0.0/16
origin:http://localhost:*
